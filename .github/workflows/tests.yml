name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily, to catch new Home Assistant releases and betas
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      homeassistant:
        description: Also test this Home Assistant version (e.g. 2026.8.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve Home Assistant versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install packaging

      - name: Resolve versions
        id: matrix
        env:
          HOMEASSISTANT: ${{ inputs.homeassistant }}
        run: |
          matrix=$(python scripts/ha_test_matrix.py "$HOMEASSISTANT")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  pytest:
    name: Run tests (${{ matrix.channel }} ${{ matrix.homeassistant }})
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A beta breaking shouldn't block PRs, but must still fail the scheduled run
    continue-on-error: ${{ matrix.channel == 'beta' && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        env:
          HOMEASSISTANT: ${{ matrix.homeassistant }}
          TEST_PACKAGE: ${{ matrix.test_package }}
        run: |
          python -m pip install uv
          echo "homeassistant==$HOMEASSISTANT" > "$RUNNER_TEMP/overrides.txt"
          uv pip install --system --requirement requirements_test.txt "$TEST_PACKAGE" \
            --override "$RUNNER_TEMP/overrides.txt"

      - name: Run pytest
        run: python -m pytest

  find-minimum:
    name: Find required minimum
    needs: pytest
    if: ${{ !cancelled() && needs.pytest.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - name: Check which versions failed
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name')
          # If stable fails too, the code is broken and a new minimum won't help
          if grep -q '(minimum ' <<< "$failed" && ! grep -q '(stable ' <<< "$failed"; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.failed.outputs.outdated == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.failed.outputs.outdated == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Find the lowest passing version
        id: find
        if: steps.failed.outputs.outdated == 'true'
        run: |
          python -m pip install packaging uv
          version=$(python scripts/ha_find_minimum.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "::error file=hacs.json::Tests need Home Assistant $version or newer, update hacs.json"
          fi

  bump-minimum:
    name: Open PR to bump minimum
    needs: find-minimum
    if: ${{ !cancelled() && needs.find-minimum.outputs.version != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Update hacs.json
        env:
          VERSION: ${{ needs.find-minimum.outputs.version }}
        run: |
          sed -i -E "s/(\"homeassistant\": \")[^\"]+/\1$VERSION/" hacs.json

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with the default token don't start pull_request workflows
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          branch: bump-ha-minimum
          delete-branch: true
          commit-message: Require Home Assistant ${{ needs.find-minimum.outputs.version }}
          title: Require Home Assistant ${{ needs.find-minimum.outputs.version }}
          body: |
            Tests fail on the minimum version in `hacs.json`. ${{ needs.find-minimum.outputs.version }} is the lowest version they pass on.

            Found by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  open-issue:
    name: Open issue for new version failures
    needs: pytest
    if: ${{ !cancelled() && needs.pytest.result == 'failure' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open an issue for each failing release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure")
              | select(.name | test("\\((stable|beta) "))
              | [(.name | capture("\\((?<channel>\\w+) (?<version>[^)]+)\\)") | .channel, .version), .html_url]
              | @tsv' |
          while IFS=$'\t' read -r channel version url; do
            # One issue per monthly release, so each beta doesn't open another
            title="Tests fail on Home Assistant $(cut -d. -f1,2 <<< "$version")"
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title')
            if ! grep -qxF "$title" <<< "$existing"; then
              gh issue create --title "$title" --body "Tests fail on Home Assistant $version ($channel): $url"
            fi
          done
